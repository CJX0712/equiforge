name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Ruff lint
        run: python -m ruff check equiforge/ examples/ tests/

      - name: Ruff format check
        run: python -m ruff format --check equiforge/ examples/ tests/

      - name: Pytest
        run: python -m pytest tests/

      - name: Benchmark demo (gate + determinism smoke)
        run: python examples/run_demo.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan for secrets / tokens
        run: |
          # Quantified patterns only match *actual* credentials; the workflow
          # file itself is excluded so the scan never matches its own command text.
          if grep -rEn --exclude-dir=.github "(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" --include="*.py" --include="*.yml" --include="*.toml" --include="*.txt" --include="*.md" . ; then
            echo "::error::Possible secret material detected in source tree."
            exit 1
          fi
          echo "Secret scan OK."
